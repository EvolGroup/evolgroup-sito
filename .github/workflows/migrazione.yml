name: Trasferisci articoli e immagini da WordPress (una tantum)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/migra-wordpress.mjs
      - run: |
          git config user.name "migrazione"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ public/ data/sito.json
          git commit -m "Articoli e immagini trasferiti da WordPress"
          git push
