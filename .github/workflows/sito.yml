name: Aggiorna e pubblica il sito

on:
  push:
    branches: [main]          # ogni modifica (anche da Pages CMS) pubblica il sito
  schedule:
    - cron: '7 * * * *'       # ogni ora: controlla Getrix
  workflow_dispatch:          # pulsante "Run workflow" per pubblicare a mano

permissions:
  contents: write

concurrency:
  group: sito
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scarica gli immobili da Getrix
        id: getrix
        env:
          GETRIX_CODICE: ${{ secrets.GETRIX_CODICE }}
        run: |
          node scripts/getrix.mjs || echo "Getrix non raggiungibile: uso gli ultimi dati salvati"
          if git diff --quiet -- data/; then echo "cambiato=no" >> "$GITHUB_OUTPUT"; else echo "cambiato=si" >> "$GITHUB_OUTPUT"; fi

      - name: Salva gli immobili aggiornati
        if: steps.getrix.outputs.cambiato == 'si'
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Immobili aggiornati da Getrix"
          git push

      - name: Costruisci il sito
        if: github.event_name != 'schedule' || steps.getrix.outputs.cambiato == 'si'
        run: node src/build.mjs

      - name: Pubblica su Cloudflare Pages
        if: github.event_name != 'schedule' || steps.getrix.outputs.cambiato == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=evolgroup --branch=main
