name: Prova avviso email (temporaneo)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prova-avviso.yml']
permissions:
  contents: write
  issues: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p stato
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} node scripts/getrix.mjs --prova-avviso > stato/avviso.txt 2>&1 || true
          cat stato/avviso.txt
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato/avviso.txt && git commit -m "Prova avviso [skip ci]" && git pull --rebase -q && git push || true
# prova 2
