name: Crea i reindirizzamenti dal vecchio sito (una tantum)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/redirect-vecchio-sito.mjs
      - run: |
          git config user.name "redirect"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/_redirects
          git commit -m "Reindirizzamenti dal vecchio sito WordPress" || echo "nessuna modifica"
          git push
