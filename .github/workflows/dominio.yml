name: Collega il dominio evolgroup.it

# Temporaneo: controlla la propagazione dei nameserver e, appena la zona
# Cloudflare è attiva, collega evolgroup.it e www.evolgroup.it al progetto Pages.
# Scrive l'esito in stato/dominio.txt. Da rimuovere a dominio attivo.
# (avvio manuale tramite push)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dominio.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dominio
  cancel-in-progress: false

jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla e collega
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          mkdir -p stato
          API=https://api.cloudflare.com/client/v4
          H=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          {
            echo "Controllo: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "NS pubblici (8.8.8.8): $(dig +short NS evolgroup.it @8.8.8.8 | sort | tr '\n' ' ')"
            echo "NS registro .it: $(dig +norec NS evolgroup.it @a.dns.it | awk '$4=="NS"{print $5}' | sort | tr '\n' ' ')"
            echo "Zona Cloudflare: $(curl -s "${H[@]}" "$API/zones?name=evolgroup.it" | jq -c '[.success, (.result[0].status // null), (.errors[0].message // null)]')"
          } > stato/dominio.txt

          DOMINI=$(curl -s "${H[@]}" "$API/accounts/$CF_ACCOUNT/pages/projects/evolgroup/domains")
          echo "Domini Pages (prima): $(echo "$DOMINI" | jq -c '[.success, [.result[]? | {name, status}], (.errors[0].message // null)]')" >> stato/dominio.txt

          if dig +norec NS evolgroup.it @a.dns.it | grep -qi cloudflare; then
            for D in evolgroup.it www.evolgroup.it; do
              if ! echo "$DOMINI" | jq -e --arg d "$D" '.result[]? | select(.name==$d)' > /dev/null; then
                R=$(curl -s -X POST "${H[@]}" "$API/accounts/$CF_ACCOUNT/pages/projects/evolgroup/domains" -d "{\"name\":\"$D\"}")
                echo "Aggiunta $D: $(echo "$R" | jq -c '[.success, (.result.status // null), (.errors[0].message // null)]')" >> stato/dominio.txt
              fi
            done
            sleep 20
            echo "Domini Pages (dopo): $(curl -s "${H[@]}" "$API/accounts/$CF_ACCOUNT/pages/projects/evolgroup/domains" | jq -c '[.result[]? | {name, status, err: (.verification_data.error_message // .validation_data.error_message // null)}]')" >> stato/dominio.txt
          else
            echo "Nameserver non ancora propagati: nessuna azione." >> stato/dominio.txt
          fi

          for U in https://evolgroup.it/ https://www.evolgroup.it/; do
            echo "HTTP $U: $(curl -s -o /dev/null -m 15 -w '%{http_code} %{redirect_url}' "$U")" >> stato/dominio.txt
          done
          echo "A evolgroup.it (1.1.1.1): $(dig +short A evolgroup.it @1.1.1.1 | tr '\n' ' ')" >> stato/dominio.txt
          cat stato/dominio.txt

      - name: Salva l'esito
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato/dominio.txt
          git commit -m "Stato dominio [skip ci]" && git pull --rebase -q && git push || true
