# Configurazione del pannello Pages CMS (app.pagescms.org)
media:
  input: public/media/blog
  output: /media/blog
content:
  - name: blog
    label: Articoli del blog
    type: collection
    path: content/blog
    filename: "{primary}.md"
    view:
      fields: [titolo, data, bozza]
      sort: [data]
      default:
        sort: data
        order: desc
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: data
        label: Data di pubblicazione
        type: date
        required: true
      - name: immagine
        label: Immagine di copertina (orizzontale, almeno 1600 px)
        type: image
      - name: estratto
        label: Riassunto (2 righe, compare nelle anteprime e su Google)
        type: text
      - name: autore
        label: Autore
        type: string
        default: Pietro Torcia
      - name: bozza
        label: Bozza (non pubblicare ancora)
        type: boolean
        default: false
      - name: body
        label: Testo dell'articolo
        type: rich-text
  - name: venduti
    label: Venduti e affittati
    type: file
    path: data/venduti.json
    format: json
    fields:
      - name: immobili
        label: 'Immobili. Quelli "da confermare" sono usciti da Getrix, scegli Venduto, Affittato o Nascondi'
        type: object
        list: true
        fields:
          - { name: stato, label: Stato, type: select, options: { values: ["da confermare", "venduto", "affittato", "nascondi"] } }
          - { name: proposta, label: "Proposta automatica (in base al contratto su Getrix)", type: string }
          - { name: rif, label: Riferimento Getrix, type: string }
          - { name: tipologia, label: Tipologia, type: string }
          - { name: locali, label: Locali, type: string }
          - { name: mq, label: Superficie (m²), type: number }
          - { name: bagni, label: Bagni, type: string }
          - { name: indirizzo, label: Indirizzo, type: string }
          - { name: comune, label: Comune, type: string }
          - { name: data, label: Data, type: date }
          - { name: foto, label: Foto, type: string }
          - { name: id, label: Codice, type: string }
          - { name: slug, label: Indirizzo della vecchia pagina, type: string, hidden: true }
          - { name: reinseritoCome, label: Reinserito come, type: string, hidden: true }
          - { name: galleria, label: Altre foto, type: string, list: true, hidden: true }
