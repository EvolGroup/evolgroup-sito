# Configurazione del pannello Pages CMS (app.pagescms.org)
media:
  input: public/media/blog
  output: /media/blog
content:
  - name: blog
    label: Articoli del blog
    type: collection
    path: content/blog
    filename: "{primary}.md"
    view:
      fields: [titolo, data, bozza]
      sort: [data]
      default:
        sort: data
        order: desc
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: data
        label: Data di pubblicazione
        type: date
        required: true
      - name: immagine
        label: Immagine di copertina (orizzontale, almeno 1600 px)
        type: image
      - name: estratto
        label: Riassunto (2 righe, compare nelle anteprime e su Google)
        type: text
      - name: autore
        label: Autore
        type: string
        default: Pietro Torcia
      - name: bozza
        label: Bozza (non pubblicare ancora)
        type: boolean
        default: false
      - name: body
        label: Testo dell'articolo
        type: rich-text
